<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto API</title>
    <link rel="stylesheet" href="style.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <div class="CadAluno">
        <h1>Cadastro</h1>
        <form class="formAluno" action="">
            <input type="text" class="nomeAluno" name="nome" placeholder="Nome">
            <input type="text" class="curso" name="curso" placeholder="Curso">
            <input type="text" class="valor" name="valor" placeholder="Valor">
            <button>Cadastrar Aluno</button>
        </form>
    </div>
    <br>
    <div class="CadDisciplina">
        <form class="formDisc" action="">
            <input type="text" class="nomeDisciplina" name="Disciplina" placeholder="Disciplina">
            <input type="text" class="descricao" name="descricao" placeholder="Descrição">
            <input type="text" class="professor" name="professor" placeholder="Professor">
            <button>Cadastrar Disciplina</button>
        </form>
    </div>
</body>
</html>
